<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Budget Calendar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #107c41;
            --primary-dark: #0b582e;
            --primary-light: #e6f2ec;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
            --cell-header-bg: #2b579a;
            --danger-color: #dc2626;
            --success-color: #16a34a;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            background: var(--primary-color);
            color: white;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 { font-size: 1.25rem; font-weight: 600; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .user-email-tag {
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .sync-status {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
        .status-dot.online { background: #22c55e; }

        .btn-header {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn-admin { background: #8b5cf6 !important; border-color: #a78bfa !important; }

        .tabs-bar {
            background: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            padding: 8px 12px 0 12px;
            gap: 6px;
            border-bottom: 2px solid var(--primary-color);
        }

        .controls-panel {
            padding: 12px 18px;
            background: rgba(0,0,0,0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .form-group { display: flex; align-items: center; gap: 6px; }

        input, select, button, textarea {
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        button.btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 3fr 1.2fr;
            gap: 18px;
            padding: 18px;
        }

        .calendar-section { display: flex; flex-direction: column; gap: 12px; }

        .calendar-header-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background-color: var(--primary-light);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .info-box { display: flex; flex-direction: column; }
        .info-box span.title { font-size: 0.7rem; font-weight: bold; color: var(--primary-dark); }
        .info-box span.val { font-size: 1.05rem; font-weight: bold; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
        }

        .day-header {
            background-color: var(--cell-header-bg);
            color: white;
            text-align: center;
            padding: 6px 2px;
            font-weight: 600;
            font-size: 0.75rem;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .day-cell {
            min-height: 100px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
        }

        .day-cell.other-month { opacity: 0.3; }
        .day-number { font-weight: bold; font-size: 0.8rem; }
        .day-balance { font-size: 0.75rem; font-weight: 600; margin-top: auto; }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }

        .panel-box {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
        }

        .panel-header {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 12px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .admin-drawer {
            position: fixed;
            top: 0; right: -420px;
            width: 400px; height: 100vh;
            background: #1e1b4b; color: #f3f4f6;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            z-index: 10000;
            transition: right 0.3s ease-in-out;
            display: flex; flex-direction: column; padding: 20px;
        }

        .admin-drawer.open { right: 0; }
        .gemini-chat-history { flex: 1; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.8); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-card { background: var(--card-bg); padding: 24px; border-radius: 12px; width: 100%; max-width: 440px; }
    </style>
</head>
<body>

<div id="authModal" class="modal-overlay">
    <div class="modal-card" style="text-align: center;">
        <h2>Sign In to Your Budget</h2>
        <form onsubmit="handleAuthSubmit(event)">
            <input type="email" id="authEmail" style="width: 100%; margin: 12px 0;" placeholder="Email Address" required>
            <input type="password" id="authPassword" style="width: 100%; margin-bottom: 12px;" placeholder="Password" required minlength="6">
            <button type="submit" class="btn-primary" style="width: 100%; padding: 10px;">Sign In</button>
        </form>
    </div>
</div>

<div id="adminDrawer" class="admin-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="color:#c084fc;">✨ Gemini AI Live Editor</h2>
        <button onclick="toggleAdminDrawer()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <input type="password" id="geminiApiKey" placeholder="Gemini API Key (AIzaSy...)" style="width: 100%; margin-bottom: 10px;">
    <div id="geminiChatHistory" class="gemini-chat-history">Ready for AI code commands...</div>
    <textarea id="geminiPrompt" rows="3" placeholder="Change theme or add feature..." style="width: 100%; margin-bottom: 8px;"></textarea>
    <button onclick="sendGeminiLiveCodeRequest()" class="btn-primary" style="background:#6366f1;">Apply Changes</button>
</div>

<div class="container">
    <header>
        <h1>Cloud Budget Calendar</h1>
        <div class="header-actions">
            <span id="userEmailDisplay" class="user-email-tag" style="display: none;"></span>
            <button id="adminBtn" class="btn-header btn-admin" style="display: none;" onclick="toggleAdminDrawer()">✨ AI Admin</button>
            <button class="btn-header" id="logoutBtn" style="display: none;" onclick="signOutUser()">Sign Out</button>
            <div class="sync-status">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">Offline</span>
            </div>
        </div>
    </header>

    <div class="controls-panel">
        <label>Month:</label>
        <select id="monthSelect" onchange="renderCalendar()"></select>
        <label>Year:</label>
        <select id="yearSelect" onchange="renderCalendar()"></select>
        <label style="margin-left:15px;">Base Initial Balance:</label>
        <input type="number" id="initialBalanceInput" value="0.00" step="0.01" style="width: 100px;" onchange="renderCalendar()">
    </div>

    <div class="main-layout">
        <div class="calendar-section">
            <div class="calendar-header-info">
                <div class="info-box"><span class="title">Start Bal</span><span class="val" id="dispStartBal">$0.00</span></div>
                <div class="info-box"><span class="title">End Bal</span><span class="val" id="dispEndBal">$0.00</span></div>
                <div class="info-box"><span class="title">Cash In</span><span class="val" style="color: var(--success-color);" id="dispCashIn">$0.00</span></div>
                <div class="info-box"><span class="title">Cash Out</span><span class="val" style="color: var(--danger-color);" id="dispCashOut">$0.00</span></div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div class="sidebar">
            <div class="panel-box">
                <div class="panel-header">Category Breakdown</div>
                <div style="padding:15px;"><canvas id="categoryPieChart"></canvas></div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEDm48--bqzvcVO41jF5wf2Zz7LiPLp4o",
      authDomain: "buget-calendar.firebaseapp.com",
      projectId: "buget-calendar",
      storageBucket: "buget-calendar.firebasestorage.app",
      messagingSenderId: "626997835688",
      appId: "1:626997835688:web:b9baacf46aee9424de4f9d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const ADMIN_EMAIL = "caleb.self17@gmail.com";

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('statusDot').classList.add('online');
            document.getElementById('statusText').textContent = "Cloud Synced";
            document.getElementById('userEmailDisplay').textContent = user.email;
            document.getElementById('userEmailDisplay').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            document.getElementById('authModal').style.display = 'none';

            if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById('adminBtn').style.display = 'inline-block';
            }
        }
    });

    function handleAuthSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPassword').value;
        auth.signInWithEmailAndPassword(email, pass).catch(err => alert(err.message));
    }

    function signOutUser() { auth.signOut(); location.reload(); }

    function populateDropdowns() {
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const mSel = document.getElementById('monthSelect');
        const ySel = document.getElementById('yearSelect');
        const now = new Date();

        months.forEach((m, idx) => mSel.innerHTML += `<option value="${idx}" ${idx === now.getMonth() ? 'selected' : ''}>${m}</option>`);
        for (let y = now.getFullYear() - 5; y <= now.getFullYear() + 5; y++) {
            ySel.innerHTML += `<option value="${y}" ${y === now.getFullYear() ? 'selected' : ''}>${y}</option>`;
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '<div class="day-header">Sun</div><div class="day-header">Mon</div><div class="day-header">Tue</div><div class="day-header">Wed</div><div class="day-header">Thu</div><div class="day-header">Fri</div><div class="day-header">Sat</div>';

        const month = parseInt(document.getElementById('monthSelect').value);
        const year = parseInt(document.getElementById('yearSelect').value);
        
        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div class="day-cell other-month"></div>`;
        }

        for (let day = 1; day <= totalDays; day++) {
            grid.innerHTML += `
                <div class="day-cell">
                    <span class="day-number">${day}</span>
                    <div class="day-balance">$0.00</div>
                </div>`;
        }
    }

    function toggleAdminDrawer() {
        document.getElementById('adminDrawer').classList.toggle('open');
    }

    async function sendGeminiLiveCodeRequest() {
        const prompt = document.getElementById('geminiPrompt').value;
        const key = document.getElementById('geminiApiKey').value;
        if (!key) return alert("Please enter API Key!");

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ contents: [{ parts: [{ text: "Write JS snippet ONLY to: " + prompt }] }] })
        });
        const data = await res.json();
        const code = data.candidates[0].content.parts[0].text.replace(/```javascript|```/g, '');
        eval(code);
    }

    window.onload = () => {
        populateDropdowns();
        renderCalendar();
    };
</script>
</body>
</html>
