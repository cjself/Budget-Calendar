<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Budget Calendar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #107c41;
            --primary-dark: #0b582e;
            --primary-light: #e6f2ec;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
            --cell-header-bg: #2b579a;
            --danger-color: #dc2626;
            --success-color: #16a34a;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            background: var(--primary-color);
            color: white;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 { font-size: 1.25rem; font-weight: 600; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .user-email-tag {
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .sync-status {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
        .status-dot.online { background: #22c55e; }

        .btn-header {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn-admin { background: #8b5cf6 !important; border-color: #a78bfa !important; }

        .controls-panel {
            padding: 12px 18px;
            background: rgba(0,0,0,0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }

        label { font-size: 0.75rem; font-weight: 600; opacity: 0.8; }

        input, select, button, textarea {
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        button.btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 3fr 1.2fr;
            gap: 18px;
            padding: 18px;
        }

        .calendar-section { display: flex; flex-direction: column; gap: 12px; }

        .calendar-header-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background-color: var(--primary-light);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .info-box { display: flex; flex-direction: column; }
        .info-box span.title { font-size: 0.7rem; font-weight: bold; color: var(--primary-dark); }
        .info-box span.val { font-size: 1.05rem; font-weight: bold; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
        }

        .day-header {
            background-color: var(--cell-header-bg);
            color: white;
            text-align: center;
            padding: 6px 2px;
            font-weight: 600;
            font-size: 0.75rem;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .day-cell {
            min-height: 110px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
        }

        .day-cell.other-month { opacity: 0.3; }
        .day-number { font-weight: bold; font-size: 0.8rem; }

        .entries-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.7rem;
            margin-top: 4px;
            overflow-y: auto;
            max-height: 60px;
        }

        .entry-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
            border-radius: 3px;
            cursor: pointer;
        }

        .entry-item.income { background: #dcfce7; color: #15803d; }
        .entry-item.expense { background: #fee2e2; color: #b91c1c; }

        .day-balance {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: auto;
            border-top: 1px dashed var(--border-color);
            padding-top: 2px;
        }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }

        .panel-box {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
        }

        .panel-header {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 12px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .admin-drawer {
            position: fixed;
            top: 0; right: -420px;
            width: 400px; height: 100vh;
            background: #1e1b4b; color: #f3f4f6;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            z-index: 10000;
            transition: right 0.3s ease-in-out;
            display: flex; flex-direction: column; padding: 20px;
        }

        .admin-drawer.open { right: 0; }
        .gemini-chat-history { flex: 1; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 15px; font-size: 0.85rem; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.8); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-card { background: var(--card-bg); padding: 24px; border-radius: 12px; width: 100%; max-width: 440px; }
    </style>
</head>
<body>

<!-- Authentication Modal -->
<div id="authModal" class="modal-overlay">
    <div class="modal-card" style="text-align: center;">
        <h2 id="authTitle" style="margin-bottom: 6px;">Sign In to Your Personal Calendar</h2>
        <p id="authSubtext" style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 18px;">Access your private personal budget and schedule.</p>
        <div id="authError" style="color: var(--danger-color); font-size: 0.8rem; margin-bottom: 12px; display: none;"></div>
        <form onsubmit="handleAuthSubmit(event)">
            <input type="email" id="authEmail" style="width: 100%; margin-bottom: 12px;" placeholder="Email Address" required>
            <input type="password" id="authPassword" style="width: 100%; margin-bottom: 12px;" placeholder="Password" required minlength="6">
            <button type="submit" id="authSubmitBtn" class="btn-primary" style="width: 100%; padding: 10px; font-size: 0.95rem;">Sign In</button>
        </form>
        <span id="authToggleBtn" style="font-size: 0.8rem; color: var(--primary-color); cursor: pointer; margin-top: 12px; display: inline-block; text-decoration: underline;" onclick="toggleAuthMode()">Need an account? Sign Up</span>
    </div>
</div>

<!-- Admin Drawer -->
<div id="adminDrawer" class="admin-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="color:#c084fc;">✨ Gemini AI Live Editor</h2>
        <button onclick="toggleAdminDrawer()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <input type="password" id="geminiApiKey" placeholder="Gemini API Key (AIzaSy...)" style="width: 100%; margin-bottom: 10px;">
    <div id="geminiChatHistory" class="gemini-chat-history">Ready for AI code updates...</div>
    <textarea id="geminiPrompt" rows="3" placeholder="Describe UI or logic change..." style="width: 100%; margin-bottom: 8px;"></textarea>
    <button onclick="sendGeminiLiveCodeRequest()" class="btn-primary" style="background:#6366f1;">Apply Changes</button>
</div>

<div class="container">
    <header>
        <h1>Cloud Budget Calendar</h1>
        <div class="header-actions">
            <span id="userEmailDisplay" class="user-email-tag" style="display: none;"></span>
            <button id="adminBtn" class="btn-header btn-admin" style="display: none;" onclick="toggleAdminDrawer()">✨ AI Admin</button>
            <button class="btn-header" id="logoutBtn" style="display: none;" onclick="signOutUser()">Sign Out</button>
            <div class="sync-status">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">Offline</span>
            </div>
        </div>
    </header>

    <div class="controls-panel">
        <div class="form-group">
            <label>Month</label>
            <select id="monthSelect" onchange="renderCalendar()"></select>
        </div>
        <div class="form-group">
            <label>Year</label>
            <select id="yearSelect" onchange="renderCalendar()"></select>
        </div>
        <div class="form-group">
            <label>Base Initial Balance</label>
            <input type="number" id="initialBalanceInput" value="0.00" step="0.01" style="width: 110px;" onchange="saveInitialBalance()">
        </div>
    </div>

    <!-- Entry Add / Edit Form -->
    <div class="controls-panel">
        <form id="transactionForm" onsubmit="saveTransaction(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; width: 100%; align-items: flex-end;">
            <input type="hidden" id="transId" value="">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="transDate" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="transDesc" placeholder="e.g. Paycheck, Electric" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="transCategory">
                    <option value="General">General</option>
                    <option value="Housing">Housing</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Food">Food/Groceries</option>
                    <option value="Income">Income</option>
                </select>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="transType">
                    <option value="expense">Expense (-)</option>
                    <option value="income">Income (+)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="transAmount" step="0.01" min="0.01" placeholder="0.00" required>
            </div>
            <div style="display: flex; gap: 6px;">
                <button type="submit" id="submitBtn" class="btn-primary" style="height: 36px; flex: 1;">+ Save Transaction</button>
            </div>
        </form>
    </div>

    <div class="main-layout">
        <div class="calendar-section">
            <div class="calendar-header-info">
                <div class="info-box"><span class="title">Start Bal</span><span class="val" id="dispStartBal">$0.00</span></div>
                <div class="info-box"><span class="title">End Bal</span><span class="val" id="dispEndBal">$0.00</span></div>
                <div class="info-box"><span class="title">Cash In</span><span class="val" style="color: var(--success-color);" id="dispCashIn">$0.00</span></div>
                <div class="info-box"><span class="title">Cash Out</span><span class="val" style="color: var(--danger-color);" id="dispCashOut">$0.00</span></div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div class="sidebar">
            <div class="panel-box">
                <div class="panel-header">Category Breakdown</div>
                <div style="padding: 15px;"><canvas id="categoryPieChart"></canvas></div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEDm48--bqzvcVO41jF5wf2Zz7LiPLp4o",
      authDomain: "buget-calendar.firebaseapp.com",
      projectId: "buget-calendar",
      storageBucket: "buget-calendar.firebasestorage.app",
      messagingSenderId: "626997835688",
      appId: "1:626997835688:web:b9baacf46aee9424de4f9d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const ADMIN_EMAIL = "caleb.self17@gmail.com";
    let currentUser = null;
    let isSignUpMode = false;
    let transactions = [];
    let initialBalance = 0;
    let pieChartInstance = null;

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('statusDot').classList.add('online');
            document.getElementById('statusText').textContent = "Cloud Synced";
            document.getElementById('userEmailDisplay').textContent = user.email;
            document.getElementById('userEmailDisplay').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            document.getElementById('authModal').style.display = 'none';

            if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById('adminBtn').style.display = 'inline-block';
            }

            attachUserListeners();
        } else {
            currentUser = null;
            transactions = [];
            document.getElementById('statusDot').classList.remove('online');
            document.getElementById('statusText').textContent = "Offline";
            document.getElementById('authModal').style.display = 'flex';
        }
    });

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('authTitle').textContent = isSignUpMode ? "Create Your Account" : "Sign In to Your Personal Calendar";
        document.getElementById('authSubmitBtn').textContent = isSignUpMode ? "Sign Up" : "Sign In";
        document.getElementById('authToggleBtn').textContent = isSignUpMode ? "Already have an account? Sign In" : "Need an account? Sign Up";
        document.getElementById('authError').style.display = 'none';
    }

    function handleAuthSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPassword').value;
        const errDiv = document.getElementById('authError');
        errDiv.style.display = 'none';

        if (isSignUpMode) {
            auth.createUserWithEmailAndPassword(email, pass).catch(err => {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            });
        } else {
            auth.signInWithEmailAndPassword(email, pass).catch(err => {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            });
        }
    }

    function signOutUser() { auth.signOut(); }

    function attachUserListeners() {
        if (!currentUser) return;

        // Fetch user initial balance
        db.collection('users').doc(currentUser.uid).collection('settings').doc('balance')
            .onSnapshot(doc => {
                if (doc.exists) {
                    initialBalance = parseFloat(doc.data().value || 0);
                    document.getElementById('initialBalanceInput').value = initialBalance.toFixed(2);
                } else {
                    initialBalance = 0;
                    document.getElementById('initialBalanceInput').value = "0.00";
                }
                renderCalendar();
            });

        // Listen for user personal transactions
        db.collection('users').doc(currentUser.uid).collection('transactions')
            .onSnapshot(snapshot => {
                transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCalendar();
            });
    }

    function saveInitialBalance() {
        if (!currentUser) return;
        const val = parseFloat(document.getElementById('initialBalanceInput').value) || 0;
        db.collection('users').doc(currentUser.uid).collection('settings').doc('balance')
            .set({ value: val });
    }

    function saveTransaction(e) {
        e.preventDefault();
        if (!currentUser) return;

        const id = document.getElementById('transId').value;
        const payload = {
            date: document.getElementById('transDate').value,
            desc: document.getElementById('transDesc').value,
            category: document.getElementById('transCategory').value,
            type: document.getElementById('transType').value,
            amount: parseFloat(document.getElementById('transAmount').value)
        };

        if (id) {
            db.collection('users').doc(currentUser.uid).collection('transactions').doc(id).update(payload);
        } else {
            db.collection('users').doc(currentUser.uid).collection('transactions').add(payload);
        }

        document.getElementById('transactionForm').reset();
        document.getElementById('transId').value = '';
        document.getElementById('submitBtn').textContent = '+ Save Transaction';
    }

    function editTransaction(id) {
        const item = transactions.find(t => t.id === id);
        if (!item) return;

        document.getElementById('transId').value = item.id;
        document.getElementById('transDate').value = item.date;
        document.getElementById('transDesc').value = item.desc;
        document.getElementById('transCategory').value = item.category;
        document.getElementById('transType').value = item.type;
        document.getElementById('transAmount').value = item.amount;
        document.getElementById('submitBtn').textContent = 'Update Transaction';
    }

    function deleteTransaction(id) {
        if (!currentUser || !confirm("Delete this transaction?")) return;
        db.collection('users').doc(currentUser.uid).collection('transactions').doc(id).delete();
    }

    function populateDropdowns() {
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const mSel = document.getElementById('monthSelect');
        const ySel = document.getElementById('yearSelect');
        const now = new Date();

        months.forEach((m, idx) => mSel.innerHTML += `<option value="${idx}" ${idx === now.getMonth() ? 'selected' : ''}>${m}</option>`);
        for (let y = now.getFullYear() - 5; y <= now.getFullYear() + 5; y++) {
            ySel.innerHTML += `<option value="${y}" ${y === now.getFullYear() ? 'selected' : ''}>${y}</option>`;
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '<div class="day-header">Sun</div><div class="day-header">Mon</div><div class="day-header">Tue</div><div class="day-header">Wed</div><div class="day-header">Thu</div><div class="day-header">Fri</div><div class="day-header">Sat</div>';

        const month = parseInt(document.getElementById('monthSelect').value);
        const year = parseInt(document.getElementById('yearSelect').value);

        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        let runningBal = initialBalance;
        let monthlyCashIn = 0;
        let monthlyCashOut = 0;
        const categoryTotals = {};

        for (let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div class="day-cell other-month"></div>`;
        }

        for (let day = 1; day <= totalDays; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayTrans = transactions.filter(t => t.date === dateStr);

            let dayEntriesHtml = '';
            dayTrans.forEach(t => {
                if (t.type === 'income') {
                    runningBal += t.amount;
                    monthlyCashIn += t.amount;
                } else {
                    runningBal -= t.amount;
                    monthlyCashOut += t.amount;
                    categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
                }
                dayEntriesHtml += `
                    <div class="entry-item ${t.type}" onclick="editTransaction('${t.id}')">
                        <span>${t.desc}</span>
                        <span>$${t.amount.toFixed(2)}</span>
                    </div>`;
            });

            grid.innerHTML += `
                <div class="day-cell">
                    <span class="day-number">${day}</span>
                    <div class="entries-list">${dayEntriesHtml}</div>
                    <div class="day-balance">$${runningBal.toFixed(2)}</div>
                </div>`;
        }

        document.getElementById('dispStartBal').textContent = `$${initialBalance.toFixed(2)}`;
        document.getElementById('dispEndBal').textContent = `$${runningBal.toFixed(2)}`;
        document.getElementById('dispCashIn').textContent = `$${monthlyCashIn.toFixed(2)}`;
        document.getElementById('dispCashOut').textContent = `$${monthlyCashOut.toFixed(2)}`;

        updateChart(categoryTotals);
    }

    function updateChart(categoryTotals) {
        const ctx = document.getElementById('categoryPieChart').getContext('2d');
        const labels = Object.keys(categoryTotals);
        const data = Object.values(categoryTotals);

        if (pieChartInstance) pieChartInstance.destroy();

        pieChartInstance = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: labels.length ? labels : ['No Data'],
                datasets: [{
                    data: data.length ? data : [1],
                    backgroundColor: labels.length ? ['#ef4444','#3b82f6','#f59e0b','#10b981','#8b5cf6'] : ['#e5e7eb']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function toggleAdminDrawer() {
        document.getElementById('adminDrawer').classList.toggle('open');
    }

    async function sendGeminiLiveCodeRequest() {
        const promptText = document.getElementById('geminiPrompt').value;
        const key = document.getElementById('geminiApiKey').value;
        if (!key) return alert("Please enter API Key!");

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: "Write JS snippet ONLY to: " + promptText }] }] })
            });
            const data = await res.json();
            const code = data.candidates[0].content.parts[0].text.replace(/```javascript|```/g, '');
            eval(code);
        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    window.onload = () => {
        populateDropdowns();
        renderCalendar();
    };
</script>
</body>
</html>
